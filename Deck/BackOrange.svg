<?xml version="1.0" encoding="utf-8"?>
<!-- Simple orange card-back SVG for conversion to JPEG -->
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1500" viewBox="0 0 1000 1500">
  <defs>
    <linearGradient id="g1" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#FF8A33"/>
      <stop offset="100%" stop-color="#FF5A00"/>
    </linearGradient>
    <pattern id="p1" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(25)">
      <rect width="40" height="40" fill="rgba(255,255,255,0.02)" />
      <circle cx="20" cy="20" r="6" fill="rgba(255,255,255,0.03)" />
    </pattern>
  </defs>

  <!-- Background gradient -->
  <rect width="100%" height="100%" fill="url(#g1)" />

  <!-- Subtle pattern overlay -->
  <rect width="100%" height="100%" fill="url(#p1)" />

  <!-- Decorative border -->
  <rect x="24" y="24" width="952" height="1452" rx="28" ry="28" fill="none" stroke="rgba(0,0,0,0.08)" stroke-width="4" />

  <!-- Center emblem: rounded diamond -->
  <g transform="translate(500,750)">
    <rect x="-220" y="-350" width="440" height="700" rx="40" ry="40" fill="rgba(255,255,255,0.06)" transform="rotate(12)" />
    <rect x="-220" y="-350" width="440" height="700" rx="40" ry="40" fill="none" stroke="rgba(0,0,0,0.06)" stroke-width="3" transform="rotate(12)" />

    <g transform="rotate(-12)">
      <circle cx="0" cy="0" r="160" fill="rgba(255,255,255,0.08)" />
      <circle cx="0" cy="0" r="120" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="6" />

      <!-- Stylized card motif -->
      <g fill="#FFFFFF" opacity="0.95">
        <rect x="-18" y="-80" width="36" height="120" rx="8" />
        <rect x="-80" y="-18" width="160" height="36" rx="8" />
      </g>
    </g>
  </g>

  <!-- Small bottom text (optional) -->
  <text x="500" y="1430" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="rgba(255,255,255,0.7)" text-anchor="middle">The Core Four</text>
</svg>
